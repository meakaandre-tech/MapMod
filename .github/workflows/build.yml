name: Build

on:
  push:
    branches: ["main", "mm-8-real-colours"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main-release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          cat > /tmp/maxerrs.gradle <<'GRADLE'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              options.compilerArgs += ["-Xmaxerrs", "20000", "-Xmaxwarns", "0"]
            }
            tasks.register("dumpCompileClasspath") {
              doLast {
                def files = new LinkedHashSet()
                project.sourceSets.each { files.addAll(it.compileClasspath.files) }
                new File("/tmp/compile-cp.txt").text = files.join("\n")
              }
            }
          }
          GRADLE
          ./gradlew build --no-daemon --continue -Dorg.gradle.console=plain -I /tmp/maxerrs.gradle 2>&1 | tee build.log
          # the release jar holds no selftest code: that is all in the selftest jar
          jar=$(ls build/libs/mapmod-[0-9]*.jar | grep -v sources | head -1)
          if unzip -Z1 "$jar" | grep -E '^com/meakaandre/mapmod/selftest/'; then echo "selftest classes in $jar"; exit 1; fi
          # the API test uses the public API only, as another mod would
          if grep -nE '^import (static )?com\.meakaandre\.mapmod\.' src/selftest/java/com/meakaandre/mapmod/selftest/client/ApiClientTests.java | grep -vE 'com\.meakaandre\.mapmod\.api\.'; then
            echo "ApiClientTests imports more than com.meakaandre.mapmod.api"; exit 1
          fi
          # zstd comes from aircompressor's v3 line, bundled; no other aircompressor
          unzip -Z1 "$jar" | grep -E '^META-INF/jars/' | tee /tmp/nested.txt
          grep -q 'aircompressor-v3-' /tmp/nested.txt && ! grep -qE 'aircompressor-0' /tmp/nested.txt
      - name: Dump game signatures on request
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci
          if [ -f .github/dump-textures ]; then
            # the game's entity textures, to read mob faces off (one jar holds the client's assets)
            for j in $(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources); do
              if unzip -Z1 "$j" 2>/dev/null | grep -q '^assets/minecraft/textures/entity/'; then
                mkdir -p /tmp/ci/textures && unzip -o -q "$j" 'assets/minecraft/textures/entity/*' -d /tmp/ci/textures && break
              fi
            done
            ls -R /tmp/ci/textures | head -5 || true
          fi
          if [ -f .github/dump-signatures ]; then
            mcjars=$(find ~/.gradle/caches/fabric-loom .gradle/loom-cache -name '*.jar' 2>/dev/null | grep -iE 'minecraft' | grep -v sources || true)
            ./gradlew dumpCompileClasspath --no-daemon -q -I /tmp/maxerrs.gradle >/dev/null 2>&1 || true
            fabricjars=$(grep -E '/fabric-[^/]*\.jar$' /tmp/compile-cp.txt 2>/dev/null | grep -v sources | tr '\n' ' ')
            jars="$mcjars $fabricjars"
            cp=$(echo $jars | tr ' ' ':')
            for j in $jars; do unzip -Z1 "$j" | grep '\.class$' ; done | sed 's/\.class$//' | sort -u > /tmp/ci/classes.txt || true
            sed 's#/#.#g' /tmp/ci/classes.txt | grep -v 'package-info\|module-info' > /tmp/all-classes.txt
            (xargs -a /tmp/all-classes.txt -n 300 javap -p -cp "$cp" 2>/dev/null || true) | gzip -9 > /tmp/ci/javap-all.txt.gz
          fi
      - name: Smoke test (dedicated server, then a client that joins it)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Starts a production Fabric server with Fabric API, the built jar and the selftest jar, feeds it
          # .github/smoke-commands.txt, then joins it with a dev client under Xvfb (with Quicksilver loaded, to prove the
          # map runs next to it), driven by .github/smoke-script.txt, and restarts the server on the saved world
          # (.github/smoke-commands-restart.txt). Logs and screenshots go to the ci-logs branch.
          # Waits are on conditions: "#wait <seconds> <text>" in the command files and "wait <seconds> <text>" in the
          # script go on as soon as the text shows in the logs (or after the seconds).
          set +e
          mkdir -p /tmp/ci
          waitfor() {
            local secs=$1 text=$2
            shift 2
            for i in $(seq 1 "$secs"); do
              for f in "$@"; do grep -qF -- "$text" "$f" 2>/dev/null && { echo "waited ${i}s for: $text"; return 0; }; done
              sleep 1
            done
            echo "gave up after ${secs}s waiting for: $text"
            return 1
          }
          if ls build/libs/mapmod-[0-9]*.jar >/dev/null 2>&1; then
            exec > >(tee /tmp/ci/smoke.txt) 2>&1
            root=$PWD
            mc=$(grep '^minecraft_version' gradle.properties | sed 's/.*= *//')
            loader=$(grep '^loader_version' gradle.properties | sed 's/.*= *//')
            fapi=$(grep '^fabric_version' gradle.properties | sed 's/.*= *//')
            mkdir -p server/mods && cd server
            inst=$(curl -fsSL https://meta.fabricmc.net/v2/versions/installer | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['version'])")
            curl -fsSL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/$mc/$loader/$inst/server/jar"
            fapiurl=$(curl -fsSL "https://api.modrinth.com/v2/project/fabric-api/version" | python3 -c "import json,sys; v=[x for x in json.load(sys.stdin) if x['version_number']=='$fapi']; print(v[0]['files'][0]['url'])")
            echo "fabric api: $fapiurl"
            curl -fsSL -o mods/fabric-api.jar "$fapiurl"
            jar=$(ls ../build/libs/mapmod-[0-9]*.jar | grep -v sources | head -1)
            cp "$jar" mods/
            # the selftests and the test POI provider, a mod of their own that only this run loads
            cp ../build/libs/mapmod-selftest-*.jar mods/
            ls -l mods
            echo "eula=true" > eula.txt
            printf 'level-seed=12345\nwhite-list=false\nenforce-whitelist=false\nonline-mode=false\nmax-tick-time=-1\nview-distance=6\ngamemode=creative\ndifficulty=peaceful\nspawn-protection=0\npause-when-empty-seconds=-1\n' > server.properties
            mkfifo in.fifo
            (java -Xmx3G -jar server.jar --nogui < in.fifo > server.log 2>&1; echo "EXIT $?" >> server.log) &
            exec 3> in.fifo
            for i in $(seq 1 120); do
              if grep -q 'Done (' server.log || grep -q '^EXIT' server.log; then break; fi
              sleep 5
            done
            if grep -q 'Done (' server.log; then
              while read -r line; do case "$line" in "#sleep "*) sleep "${line#\#sleep }";; "#wait "*) w=${line#\#wait }; waitfor "${w%% *}" "${w#* }" server.log;; *) echo "$line" >&3; sleep 0.3;; esac; done < $root/.github/smoke-commands.txt
              sleep 5
              cd $root
              sudo apt-get update -q >/dev/null 2>&1
              sudo apt-get install -y -q xvfb xdotool x11-utils imagemagick libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 mesa-vulkan-drivers libvulkan1 mesa-utils >/dev/null 2>&1
              mkdir -p run/mods
              # Quicksilver (meakaandre-tech/Quicksilver), the optimisation mod the map must keep working with
              curl -fsSL -o run/mods/quicksilver-26.3.jar https://github.com/meakaandre-tech/Quicksilver/releases/download/latest/quicksilver-26.3.jar || echo "could not fetch Quicksilver"
              ls -l run/mods
              # no version line: the file is datafixed from the oldest layout
              printf 'pauseOnLostFocus:false\nonboardAccessibility:false\ntutorialStep:none\nnarrator:0\nrenderDistance:6\nguiScale:2\nmaxFps:30\nsoundCategory_master:0.0\n' > run/options.txt
              export LIBGL_ALWAYS_SOFTWARE=1
              # MC 26.3 (SDL3) asks for an sRGB-capable framebuffer; Xvfb's GLX visuals have none, EGL does
              export SDL_VIDEO_FORCE_EGL=1
              Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &
              export DISPLAY=:99
              sleep 2
              (glxinfo -B; eglinfo -B 2>/dev/null | head -40) > /tmp/ci/gfx.txt 2>&1
              (env -u CI timeout 1500 ./gradlew runSelftestClient --no-daemon -Dorg.gradle.console=plain --args="--quickPlayMultiplayer localhost --width 1280 --height 720" > client-gradle.log 2>&1; echo "EXIT $?" >> client-gradle.log) &
              for i in $(seq 1 300); do
                if grep -q 'joined the game' server/server.log || grep -q '^EXIT' client-gradle.log || grep -q -e 'Failed to create backend Vulkan' -e 'Caught error loading resourcepacks' run/logs/latest.log 2>/dev/null; then break; fi
                sleep 5
              done
              n=0
              shot() { n=$((n+1)); import -window root /tmp/ci/client-$(printf '%02d' $n).png; }
              if grep -q 'joined the game' server/server.log; then
                # the script starts once the client has the world around it loaded and drawn
                echo "mapmod worldtest ready 0" >&3
                waitfor 900 "SELFTEST client ready 0." run/logs/latest.log
                xdotool mousemove 640 360
                while read -r kind arg; do
                  case "$kind" in
                    cmd) echo "$arg" >&3;;
                    key) xdotool key "$arg";;
                    sleep) sleep "$arg";;
                    wait) waitfor "${arg%% *}" "${arg#* }" server/server.log run/logs/latest.log;;
                    shot) shot;;
                    move) xdotool mousemove $arg;;
                    click) xdotool mousemove $arg; sleep 0.3; xdotool click 1; sleep 0.4;;
                  esac
                done < .github/smoke-script.txt
              else
                shot
              fi
              pkill -f KnotClient; sleep 5
              tail -c 400000 client-gradle.log > /tmp/ci/client-gradle.log
              cp run/logs/latest.log /tmp/ci/client.log 2>/dev/null
              cp -r run/crash-reports /tmp/ci/client-crash-reports 2>/dev/null
              cd server
              echo "stop" >&3
              for i in $(seq 1 60); do grep -q '^EXIT' server.log && break; sleep 2; done
            fi
            exec 3>&-
            cp server.log /tmp/ci/server.log
            if grep -q 'Done (' server.log; then
              # second start on the saved world: checks that everything written above loads again
              rm -f in.fifo; mkfifo in.fifo
              (java -Xmx3G -jar server.jar --nogui < in.fifo > server2.log 2>&1; echo "EXIT $?" >> server2.log) &
              exec 3> in.fifo
              for i in $(seq 1 120); do
                if grep -q 'Done (' server2.log || grep -q '^EXIT' server2.log; then break; fi
                sleep 5
              done
              if grep -q 'Done (' server2.log; then
                while read -r line; do case "$line" in "#sleep "*) sleep "${line#\#sleep }";; "#wait "*) w=${line#\#wait }; waitfor "${w%% *}" "${w#* }" server2.log;; *) echo "$line" >&3; sleep 0.3;; esac; done < $root/.github/smoke-commands-restart.txt
                sleep 5
                echo "stop" >&3
                for i in $(seq 1 60); do grep -q '^EXIT' server2.log && break; sleep 2; done
              fi
              exec 3>&-
              cp server2.log /tmp/ci/server2.log
            fi
            ls world/data/mapmod world/data/mapmod/* > /tmp/ci/saves.txt 2>&1 || true
            if [ -n "$DISPLAY" ]; then
              # third: a server with no mods at all, joined by the same client: the client keeps its own map, checks
              # it by itself ("SELFTEST local", logged by the selftest mod's client side) and opens it
              cd $root
              mkdir -p server-plain/mods && cp server/server.jar server/server.properties server-plain/ && cd server-plain
              echo "eula=true" > eula.txt
              rm -f in.fifo; mkfifo in.fifo
              (java -Xmx3G -jar server.jar --nogui < in.fifo > server3.log 2>&1; echo "EXIT $?" >> server3.log) &
              exec 3> in.fifo
              for i in $(seq 1 120); do
                if grep -q 'Done (' server3.log || grep -q '^EXIT' server3.log; then break; fi
                sleep 5
              done
              if grep -q 'Done (' server3.log; then
                cd $root
                rm -f run/logs/latest.log
                # this one at 1920x1080 (MM-7: the top bar is checked there at GUI scales 2 to 4)
                pkill Xvfb; sleep 2
                Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
                sleep 2
                (env -u CI timeout 1200 ./gradlew runSelftestClient --no-daemon -Dorg.gradle.console=plain --args="--quickPlayMultiplayer localhost --width 1920 --height 1080" > client-local-gradle.log 2>&1; echo "EXIT $?" >> client-local-gradle.log) &
                for i in $(seq 1 300); do
                  if grep -q 'joined the game' server-plain/server3.log || grep -q '^EXIT' client-local-gradle.log; then break; fi
                  sleep 5
                done
                m=0
                lshot() { m=$((m+1)); import -window root /tmp/ci/local-$(printf '%02d' $m).png; }
                if grep -q 'joined the game' server-plain/server3.log; then
                  echo "time set noon" >&3
                  # MM-7: a flat patch at y 150 round 0,0 in a mushroom fields biome (mycelium, grass blocks, stone) with
                  # mooshrooms on it, and the player put on it
                  while read -r line; do case "$line" in "#sleep "*) sleep "${line#\#sleep }";; *) echo "$line" >&3; sleep 0.3;; esac; done < $root/.github/smoke-commands-plain.txt
                  xdotool mousemove 960 540
                  waitfor 600 "SELFTEST local ready." run/logs/latest.log && lshot
                  waitfor 300 "SELFTEST local done" run/logs/latest.log
                  sleep 5
                  lshot
                  # the patch close up, then the mycelium replaced with grass blocks on the server: the client's map follows
                  waitfor 300 "SELFTEST colours shot patch" run/logs/latest.log && lshot
                  echo "fill -24 150 -24 -9 150 23 minecraft:grass_block replace minecraft:mycelium" >&3
                  waitfor 300 "SELFTEST colours shot replaced" run/logs/latest.log && lshot
                  # the top bar at GUI scales 3 and 4 (1920x1080)
                  waitfor 120 "SELFTEST colours shot gui3" run/logs/latest.log && lshot
                  waitfor 120 "SELFTEST colours shot gui4" run/logs/latest.log && lshot
                  waitfor 120 "SELFTEST colours done" run/logs/latest.log
                fi
                pkill -f KnotClient; sleep 5
                tail -c 200000 client-local-gradle.log > /tmp/ci/client-local-gradle.log
                cp run/logs/latest.log /tmp/ci/client-local.log 2>/dev/null
                cd server-plain
              fi
              echo "stop" >&3
              for i in $(seq 1 60); do grep -q '^EXIT' server3.log && break; sleep 2; done
              exec 3>&-
              cp server3.log /tmp/ci/server3.log
              cd $root/server
            fi
            cp -r crash-reports /tmp/ci/ 2>/dev/null || true
            cd $root
          fi
      - name: Selftest results
        if: always()
        shell: bash
        run: |
          # every suite must have run to its end with no failed check, and every screenshot must be there
          mkdir -p /tmp/ci
          python3 -m pip install --quiet --user pillow || true
          set -o pipefail
          python3 .github/check-selftests.py /tmp/ci | tee /tmp/ci/selftests.txt
      - name: Publish logs to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log || echo "no log" > /tmp/ci/build.log
          sed -i "s#${GITHUB_WORKSPACE}/##g" /tmp/ci/build.log
          ls -l build/libs > /tmp/ci/jars.txt 2>&1 || true
          echo "${GITHUB_SHA}" > /tmp/ci/commit.txt
          echo "${GITHUB_REF}" > /tmp/ci/ref.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapmod-26.3
          path: |
            build/libs/*.jar
            !build/libs/mapmod-selftest-*.jar
      - name: Publish the jar as a release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest -y --cleanup-tag -R "${{ github.repository }}" || true
          sleep 3
          jar=$(ls build/libs/mapmod-[0-9]*.jar | grep -v sources | head -1)
          cp "$jar" mapmod-26.3.jar
          name=$(grep '^mod_name' gradle.properties | sed 's/.*= *//')
          notes="Built from main at ${GITHUB_SHA}. Fabric 26.3, needs Fabric API. A Satisfactory-style map for any modpack; other mods plug in through com.meakaandre.mapmod.api.MapModApi (see the README)."
          gh release create latest mapmod-26.3.jar -R "${{ github.repository }}" --target "${GITHUB_SHA}" --title "$name (latest build)" --notes "$notes"
